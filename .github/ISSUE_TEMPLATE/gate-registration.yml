name: Register a gate (public test)
description: Join the public benchmark. Only three fields are required; setup and checks can follow.
title: "Gate registration: "
labels: ["gate-registration"]
body:
  - type: markdown
    attributes:
      value: |
        ### Register once. Test when ready.
        **Registration is always open.** Seasons follow one another, four weeks each. Your gate takes part in the season that is open now, and in every season after it while this issue stays open. [Calendar and deadlines](https://github.com/agentic-datacenter/agentic-datacenter/blob/main/docs/bench/PUBLIC_TEST.md#seasons)

        | 1 · Register | 2 · Connect | 3 · Benchmark |
        | :-- | :-- | :-- |
        | Pin your exact version now | Run the interface check later | Submit results when ready |

        **Only three fields are required.** You do not need to install anything or share code, credentials or test output to register.

        Only the exact version this issue names **at a season's deadline** is eligible for that season's hidden Track D. You may update the version at any time; a change counts from the next deadline. Close the issue to leave.

        [How the public test works](https://github.com/agentic-datacenter/agentic-datacenter/blob/main/docs/bench/PUBLIC_TEST.md) · [Integration guide](https://github.com/agentic-datacenter/agentic-datacenter/blob/main/docs/guides/bring-your-own-gate.md)

  - type: markdown
    attributes:
      value: |
        ### 01 · Your registration
        Complete these three fields to reserve your entry.

  - type: input
    id: gate
    attributes:
      label: "01 · Project / gate name"
      placeholder: "e.g. My Safety Gate"
      description: "A short name is enough. The GitHub account submitting this issue is the contact."
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "02 · Exact version (must be fixed)"
      description: "A full commit SHA, package hash or container digest. Do not use a moving branch or tag. This cannot change after the deadline for Track D."
      placeholder: "e.g. 40-character commit SHA or sha256:..."
    validations:
      required: true

  - type: dropdown
    id: attached
    attributes:
      label: "03 · How will you connect it?"
      description: "Choose the closest option. You may ask for help and complete the integration later."
      options:
        - "HTTP service (http_gate)"
        - "Python package (entry point)"
        - "Command per decision (command_gate)"
        - "Not sure yet — need integration help"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---

        ### Optional · Add details when you have them
        You can register now and update the issue later. No check output is needed today.

  - type: input
    id: project_url
    attributes:
      label: Project URL (optional)
      placeholder: "https://github.com/owner/project"

  - type: textarea
    id: check
    attributes:
      label: Gate check output (optional — can be added later)
      description: "When ready, run `uv run agentic-datacenter gate check <gate>` and paste the output here or in a comment. Required before a result can be accepted, not to register."
      render: text

  - type: checkboxes
    id: provides
    attributes:
      label: What does your system bring? (optional)
      description: "A system need not decide anything to take part. Tick what fits; it can be changed later."
      options:
        - label: "Decisions: it decides on each proposed action."
        - label: "Findings: it states what it found, such as whether a mandate holds, without deciding."
        - label: "Evidence: it gives records or receipts of its own that others can check."
        - label: "Verification: it checks evidence that this project or another system made."

  - type: checkboxes
    id: listing
    attributes:
      label: Listed by name (optional)
      description: "Without this, your system is counted but never named. With it, it is listed in the table of enrolled systems with its results beside the others, and findings are described there once you have fixed them or agreed. A finding is always sent to you first. Untick it to be taken off."
      options:
        - label: "List this system by name in docs/bench/participants.md, with its results and findings."

  - type: checkboxes
    id: authors
    attributes:
      label: Independent gate (optional)
      description: "Used to distinguish independent gate authors from the benchmark authors."
      options:
        - label: "The people who wrote this gate did not write Agentic-Datacenter's contracts, scenarios or oracle."
