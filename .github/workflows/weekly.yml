# Scheduled, every Monday before the workflows of enrolled systems run theirs.
# Budget: 20 minutes. It draws the week's scenarios from the public beacon,
# runs them with no control and with the limits-only control, checks that the
# week as drawn tests something, and keeps the files and the report
# (docs/bench/WEEKLY.md, ADR 0047). It writes nothing to the repository: a
# week's scenarios are a function of the week and the beacon, not files here.
name: weekly
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  draw:
    runs-on: ubuntu-24.04
    container: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    timeout-minutes: 20
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates && git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: uv sync --frozen
      - name: Draw this week's scenarios and run them with the reference controls
        run: uv run agentic-datacenter weekly run --gate null_gate --gate static_allowlist --check --out build/weekly
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: weekly-${{ github.run_id }}
          path: build/weekly
          if-no-files-found: warn
