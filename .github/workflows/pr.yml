# Runs on every pull request, on every change of the main branch, and on request.
# Budget: 10 minutes. Pull requests from forks get no secrets.
# Every job runs in one digest-pinned image with the frozen lock, and every
# third-party action is pinned by commit SHA (ADC-CI-003, SDD 12.4).
name: pr
on:
  pull_request:
  merge_group:
  # So that the main branch itself carries the result of its checks.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: pr-${{ github.ref }}
  # A newer push to a pull request replaces the run of the older one. A run on the
  # main branch is left to finish, so every commit there carries its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  static:
    runs-on: ubuntu-24.04
    container: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    timeout-minutes: 10
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates && git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: uv sync --frozen --group iec61850
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Layer and module contracts (without the REMORA binding)
        run: uv run python tools/core_contracts.py build/importlinter-core.toml && uv run lint-imports --config build/importlinter-core.toml
      - run: uv run agentic-datacenter modules lock --check
      - run: uv run agentic-datacenter profile schema --check
      - name: Validate every profile
        run: for f in profiles/*.yaml; do uv run agentic-datacenter profile validate "$f"; done
  unit:
    runs-on: ubuntu-24.04
    container: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [agentic-datacenter-core, agentic-datacenter-data, agentic-datacenter-governance, agentic-datacenter-net, agentic-datacenter-plant, agentic-datacenter-scenarios, agentic-datacenter-supervisory, agentic-datacenter-whatif]
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates && git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install only this distribution and what it declares
        run: uv sync --frozen --package ${{ matrix.package }} --group test
      - name: Test it alone
        run: if [ -d "packages/${{ matrix.package }}/tests" ]; then uv run --frozen --no-sync pytest "packages/${{ matrix.package }}/tests"; else echo "no tests yet"; fi
  property:
    runs-on: ubuntu-24.04
    container: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    timeout-minutes: 10
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates && git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: uv sync --frozen
      - name: Property tests, derandomized
        run: uv run pytest tests/property
        env:
          ADC_HYPOTHESIS_PROFILE: pr
  conformance:
    runs-on: ubuntu-24.04
    container: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    timeout-minutes: 10
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates && git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: uv sync --frozen
      - run: uv run pytest tests/conformance
  # The whole suite, in four parts on four machines at once, each recording which
  # requirement its tests verify. With REMORA and the IEC 61850 package: a test that is
  # skipped verifies nothing, and the requirements of the governed path have no test that
  # runs without REMORA. A test that runs for a quarter of an hour prints where every
  # thread stands, so that a run that hangs can be read afterwards.
  suite:
    runs-on: ubuntu-24.04
    container: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [scenario-1, scenario-2, bench, rest]
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates && git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: uv sync --frozen --all-groups
      - name: This part of the suite, recording which requirement each test verifies
        run: |
          case "${{ matrix.part }}" in
            scenario-1) set -- tests/scenario/test_[a-l]*.py ;;
            scenario-2) set -- tests/scenario/test_[m-z]*.py ;;
            bench) set -- tests/bench ;;
            rest) set -- packages tests --ignore=tests/scenario --ignore=tests/bench ;;
          esac
          uv run pytest -n auto --dist loadfile -o faulthandler_timeout=900 --req-report "build/requirements-${{ matrix.part }}.json" "$@"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: requirements-${{ matrix.part }}
          path: build/requirements-${{ matrix.part }}.json
  traceability:
    needs: suite
    # Also when a part failed: a job that is skipped would count as a check that passed.
    if: always()
    runs-on: ubuntu-24.04
    container: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    timeout-minutes: 10
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates && git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: uv sync --frozen
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: requirements-*
          path: build
          merge-multiple: true
      - name: Every part of the suite passed
        env:
          SUITE: ${{ needs.suite.result }}
        run: test "${SUITE:-success}" = "success"
      - name: Every requirement due at this stage has a passing test and an owner
        # The keyed scan for forbidden terms needs a key that no pull request is given, so
        # its test is skipped here. The nightly workflow runs it on every commit with the key.
        run: uv run python tools/traceability.py --report build/requirements-scenario-1.json --report build/requirements-scenario-2.json --report build/requirements-bench.json --report build/requirements-rest.json --verified-elsewhere ADC-PRV-002
  docs:
    runs-on: ubuntu-24.04
    container: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    timeout-minutes: 10
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates && git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: uv sync --frozen --group docs
      - name: Generated reference pages are current
        run: uv run python tools/gen_reference.py --check
      - name: Site builds in strict mode
        run: uv run mkdocs build --strict
  supply-chain:
    runs-on: ubuntu-24.04
    container: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    timeout-minutes: 10
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates && git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: uv sync --frozen --group audit
      - run: uv lock --check
      - name: Known vulnerabilities
        run: uv export --frozen --no-emit-workspace --format requirements-txt > build-requirements.txt && uv run pip-audit -r build-requirements.txt --require-hashes --disable-pip
      - name: Provenance terms and committed secrets
        run: uv run pytest tests/conformance/test_ci.py -k "forbidden_term or notices"
      - name: Every wheel and source distribution holds its licence text
        run: uv build --all-packages --out-dir build/dist && uv run python tools/check_dist_licences.py build/dist
