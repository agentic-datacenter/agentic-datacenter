# Long benchmark runs on a machine of our own, started from anywhere:
#   gh workflow run bench-runner.yml -f tier=standard -f gates=remora_governed
# The runner is a self-hosted machine labelled "bench" (docs/guides/bench-runner.md).
# Only started by hand; never by a pull request.
name: bench-runner

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "quick, standard, season or full (docs/bench/TIERS.md)"
        type: choice
        options: [quick, standard, season, full]
        default: quick
      gates:
        description: "Gates, separated by spaces"
        type: string
        default: remora_governed
      scenario:
        description: "One scenario only, for example AD-03 (empty: all)"
        type: string
        default: ""
      first_seed:
        description: "First seed (empty: 1)"
        type: string
        default: ""
      seeds:
        description: "Number of seeds (empty: the tier's)"
        type: string
        default: ""
      jobs:
        description: "Runs at a time (empty: every core but one, shared with replay_jobs)"
        type: string
        default: ""
      replay_jobs:
        description: "Processes that share the replay of one run; for tier full (empty: 1)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: bench-runner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: [self-hosted, bench]
    # Five days, the longest GitHub lets a job on a self-hosted runner run. A `full` run
    # replays every proposal of OP-10 to the end of a simulated week (docs/bench/TIERS.md).
    timeout-minutes: 7200
    # The two write permissions are for the attestation below and nothing else (ADR 0025).
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      OUT: build/bench-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Environment
        run: |
          uv --version
          if [ "$RUNNER_OS" = "Linux" ]; then uv sync --frozen --all-groups
          else uv sync --frozen --all-groups --no-group iec61850; fi
      # Inputs reach the shell as environment variables, never pasted into the
      # script, and each is checked against what it may be before it is used.
      - name: Check the inputs
        env:
          TIER: ${{ inputs.tier }}
          GATES: ${{ inputs.gates }}
          SCENARIO: ${{ inputs.scenario }}
          FIRST_SEED: ${{ inputs.first_seed }}
          SEEDS: ${{ inputs.seeds }}
          JOBS: ${{ inputs.jobs }}
          REPLAY_JOBS: ${{ inputs.replay_jobs }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$TIER" =~ ^(quick|standard|season|full)$ ]] || fail "tier: quick, standard, season or full"
          [[ "$GATES" =~ ^[a-z0-9_]+( [a-z0-9_]+)*$ ]] || fail "gates: names of letters, digits and _, separated by single spaces"
          [[ -z "$SCENARIO" || "$SCENARIO" =~ ^(OP|AD)-[0-9]{2}$ ]] || fail "scenario: for example AD-03"
          for value in "$FIRST_SEED" "$SEEDS" "$JOBS" "$REPLAY_JOBS"; do
            [[ -z "$value" || "$value" =~ ^[1-9][0-9]{0,3}$ ]] || fail "first_seed, seeds, jobs and replay_jobs: whole numbers from 1"
          done
      - name: Run
        env:
          TIER: ${{ inputs.tier }}
          GATES: ${{ inputs.gates }}
          SCENARIO: ${{ inputs.scenario }}
          FIRST_SEED: ${{ inputs.first_seed }}
          SEEDS: ${{ inputs.seeds }}
          JOBS: ${{ inputs.jobs }}
          REPLAY_JOBS: ${{ inputs.replay_jobs }}
        run: |
          set -o pipefail
          args=(--tier "$TIER" --allow-unfrozen --out "$OUT")
          read -ra gates <<< "$GATES"
          for gate in "${gates[@]}"; do args+=(--gate "$gate"); done
          [ -n "$SCENARIO" ] && args+=(--scenario "$SCENARIO")
          [ -n "$FIRST_SEED" ] && args+=(--first-seed "$FIRST_SEED")
          [ -n "$SEEDS" ] && args+=(--seeds "$SEEDS")
          [ -n "$REPLAY_JOBS" ] && args+=(--replay-jobs "$REPLAY_JOBS")
          jobs="$JOBS"
          if [ -z "$jobs" ]; then
            # Every core but one, shared between the runs made at a time and the
            # helpers each of them may start for its replay (ADR 0026).
            cores=$(uv run python -c "import os; print(os.cpu_count() or 2)")
            jobs=$(( (cores - 1) / ${REPLAY_JOBS:-1} ))
            jobs=$(( jobs > 1 ? jobs : 1 ))
          fi
          uv run agentic-datacenter bench run "${args[@]}" --jobs "$jobs" 2>&1 | grep -v '^dispatch\.'
      - name: Release check
        env:
          GATES: ${{ inputs.gates }}
        run: |
          # Every gate is checked and its lines are kept. A reference control is there to be
          # compared with and is expected not to pass, so only a system under test fails the
          # job; the record and its attestation below are then still made for a run in which
          # a reference control did what it does.
          read -ra gates <<< "$GATES"
          failed=()
          for gate in "${gates[@]}"; do
            if ! uv run agentic-datacenter bench check "$OUT/result_card.json" --gate "$gate" | tee -a "$OUT/check.txt"; then
              case "$gate" in
                null_gate|static_allowlist) echo "::notice::$gate is a reference control; it did not pass the release check, as expected of it" ;;
                *) failed+=("$gate") ;;
              esac
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then echo "::error::did not pass the release check: ${failed[*]}"; exit 1; fi
      - name: Record the commit and the hash of every file made
        run: uv run agentic-datacenter bench record "$OUT"
      - name: Attest which commit and which job made the record
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.OUT }}/provenance.json
      - name: Keep the card
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ github.run_id }}
          path: ${{ env.OUT }}
          retention-days: 90
          if-no-files-found: warn
