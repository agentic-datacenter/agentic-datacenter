# What Statnett proposed in April 2026 for consumption facilities, as far as
# this model can try it. A proposal, not a rule: see `status`.
schema: agentic_datacenter.grid-requirements/1
id: no-nvf-2026-draft
jurisdiction: Norway
authority: Statnett, the system operator
status: proposed
status_note: >-
  Sent for consultation on 30 April 2026 as a change to the national guide for
  functional requirements (NVF). Not in force. On 9 November 2026 Statnett
  said it will set functional requirements for data centers, that they will
  go to consultation and need the regulator's approval, and that it expects
  to lift its stop on new capacity reservations no later than 1 August 2027.
  What is finally required of data centers may differ from this file.
source:
  title: Høringsdokument for oppdatering av NVF 2026
  publisher: Statnett
  published: "2026-04-30"
  url: https://www.statnett.no/globalassets/for-aktorer-i-kraftsystemet/systemansvaret/retningslinjer---horinger/horing-var-2026/horingsdokument-nvf.pdf
  sections: "8.3.1 to 8.3.4, proposing NVF 10.3.2, 10.5, 10.6 and 10.7"
read_on: "2026-11-27"
applies_to: >-
  Consumption facilities of 30 MW or more, or connected at 110 kV or above.
nominal_hz: 50

ride_through:
  # Table 10-7: 0 pu at 0 ms, 0.35 pu at 150 ms and at 550 ms, 0.9 pu at
  # 1500 ms. A facility stays connected for any voltage above the curve.
  # The table gives points and the figure was not readable when this file was
  # written, so the first step is read as zero voltage held to 150 ms: the
  # usual shape of such a curve, and the harder reading for the facility.
  curve_ms_pu:
    - [0, 0.0]
    - [150, 0.0]
    - [150, 0.35]
    - [550, 0.35]
    - [1500, 0.9]
  note: >-
    The proposal allows the facility to limit its current during the dip.

recovery:
  # 10.3.2.1: consumption is back within 5 % of what it was before the fault
  # no later than 1 second after the voltage is back above 90 %.
  voltage_back_pu: 0.9
  levels:
    - name: as proposed
      min_share: 0.95
      max_share: 1.05
      within_s: 1.0

ramp:
  # 10.6.1: the facility can set its ramp rate. The proposal sets no number;
  # the system operator weighs a requirement case by case.
  limit_share_per_s: null
  note: >-
    The facility must be able to set how fast its consumption changes. No
    limit is given: the system operator decides case by case.

low_frequency:
  # The proposal names reduction at low frequency (LFSM) as something the
  # system operator may ask for case by case (10.7), with no number. The level
  # here is not from it: it is what ENTSO-E's position gives for the Nordic
  # synchronous area (A.2.8), used so that the scenarios have a level to run on.
  threshold_hz: 49.5
  assumed: true
  note: >-
    Not from the Norwegian proposal, which gives no number. The level ENTSO-E's
    position of December 2025 gives for the Nordic synchronous area.

not_checked:
  - what: Damping of oscillations in voltage and frequency (10.5)
    why: The model has no dynamic grid; the incomer's voltage does not depend on the load.
  - what: Withstanding a rate of change of frequency (10.7)
    why: Nothing in the model reacts to how fast the frequency changes, so a pass would mean nothing.
  - what: Reducing consumption at low frequency, LFSM (10.7)
    why: The modelled facility has no such function.
  - what: Voltage steps and delivery of a simulation model (10.7)
    why: Decided case by case, and not a property a run can show.
