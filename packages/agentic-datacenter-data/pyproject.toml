[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-datacenter-data"
version = "0.0.0"
description = "Agentic-Datacenter measured input series, optional: reads a time series and its dataset manifest, verifies its hashes and maps it onto simulated time (ADR 0018)."
readme = "README.md"
license = "BUSL-1.1"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
]

[project.entry-points."agentic_datacenter.commands"]
data = "agentic_datacenter.data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_datacenter"]

[dependency-groups]
test = ["pytest", "hypothesis"]
