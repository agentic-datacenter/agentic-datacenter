[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-datacenter-scenarios"
version = "0.0.0"
description = "Agentic-Datacenter Harness: Scenario runner, fault and attack primitives, oracle, metrics and evidence bundles."
readme = "README.md"
license = "BUSL-1.1"
requires-python = ">=3.12"
dependencies = [
    "agentic-datacenter-core",
    "agentic-datacenter-plant",
    "agentic-datacenter-supervisory",
    "agentic-datacenter-net",
    "agentic-datacenter-governance",
]

[project.optional-dependencies]
# Evidence for runs on a measured input series (ADR 0018).
measured = ["agentic-datacenter-data"]
# A language-model agent (ADR 0035): the SDKs of the providers, never needed otherwise.
llm = ["anthropic", "openai"]

[tool.uv.sources]
agentic-datacenter-core = { workspace = true }
agentic-datacenter-data = { workspace = true }
agentic-datacenter-plant = { workspace = true }
agentic-datacenter-supervisory = { workspace = true }
agentic-datacenter-net = { workspace = true }
agentic-datacenter-governance = { workspace = true }

[project.entry-points."agentic_datacenter.commands"]
bench = "agentic_datacenter.scenarios.cli:bench"
demo = "agentic_datacenter.scenarios.cli:demo"
scenario = "agentic_datacenter.scenarios.cli:scenario"
gate = "agentic_datacenter.scenarios.cli:gate"
facility = "agentic_datacenter.scenarios.cli:facility"
equipment = "agentic_datacenter.scenarios.cli:equipment"
grid = "agentic_datacenter.scenarios.cli:grid"
weekly = "agentic_datacenter.scenarios.cli:weekly"
agent = "agentic_datacenter.scenarios.cli:agent"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_datacenter"]

[dependency-groups]
test = ["pytest", "hypothesis"]

[tool.agentic-datacenter]
requirements = [
    "ADC-FID-004",
    "ADC-BEN-001", "ADC-BEN-002", "ADC-BEN-003", "ADC-BEN-004", "ADC-BEN-005",
    "ADC-BEN-006", "ADC-BEN-007", "ADC-BEN-008", "ADC-BEN-009",
    "ADC-EVD-001",
    "ADC-FAC-006", "ADC-FAC-007", "ADC-FAC-008", "ADC-FAC-009",
    "ADC-AGT-001", "ADC-AGT-002", "ADC-AGT-003", "ADC-AGT-004", "ADC-AGT-005",
    "ADC-AGT-006", "ADC-AGT-007",
    "ADC-AUT-001", "ADC-AUT-002", "ADC-AUT-003", "ADC-AUT-004", "ADC-AUT-005", "ADC-AUT-006",
    "ADC-AUT-007", "ADC-AUT-008", "ADC-AUT-009", "ADC-AUT-010",
    "ADC-UX-016",
]
