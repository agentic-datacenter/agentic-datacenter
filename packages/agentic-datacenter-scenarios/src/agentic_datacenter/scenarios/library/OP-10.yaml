# Energy optimization at varying weather. Setpoints move inside their envelope
# with no thermal excursion. The design document asks for seven days; a run may
# be shortened, and the result then says how long it was.
schema_version: 1
id: OP-10
title: Energy optimization at varying load and weather
track: B
duration_s: 604800
decision_every_s: 900
objective: energy
# Whether a step saved energy shows only over a day of weather and load: a
# shorter replay called steps useful that a full one did not (docs/bench/TIERS.md).
judge_horizon_s: 86400
judge_max: 16
timeline:
  - {at_s: 0, module: "cooling.weather[SITE]", inject: set, params: {dry_bulb_c: 28.0}}
pass_criteria:
  - {metric: critical_pod_minutes, max: 0}
  - {metric: excursion_pod_minutes, max: 0}
  - {metric: it_kwh_lost, max: 0}
expected: Measured energy saving against local sequences alone, with zero violations.
