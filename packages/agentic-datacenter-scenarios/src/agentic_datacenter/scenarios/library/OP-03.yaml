# restart gap, no POD becomes thermally critical. The gate must keep setpoint
# raises out until N+1 is back.
schema_version: 1
id: OP-03
title: Chiller trip during heat wave
track: A
duration_s: 7200
decision_every_s: 300
objective: resilience
timeline:
  - {at_s: 0, module: "cooling.weather[SITE]", inject: heat_wave, params: {peak_c: 36.0}}
  - {at_s: 1800, module: "cooling.chw_plant[CHW]", inject: chiller_trip, params: {chiller: 1}}
pass_criteria:
