# Points of the thermal storage tank.
- {name: charge_pct, kind: analog_in, default: 100.0, tier: T0, description: "Stored cooling as a share of capacity", unit: "%", range: [0, 100], assumed: true}
- {name: discharging, kind: binary_in, default: false, tier: T0, description: "The tank is covering a shortfall", assumed: true}
- {name: recharging, kind: binary_in, default: false, tier: T0, description: "The tank is being recharged", assumed: true}
- {name: discharge_kw, kind: analog_in, default: 0.0, tier: T0, description: "Cooling drawn from the tank", unit: kW, range: [0, 1000000], assumed: true}
- {name: outlet_c, kind: analog_in, default: 18.0, tier: T0, description: "Chilled water temperature leaving the tank", unit: degC, range: [-10, 150], assumed: true}
- {name: supply_sp_c, kind: analog_setting, default: 18.0, tier: T3, description: "Supply temperature the tank holds; changed together with the plant setpoint", unit: degC, range: [16, 21], assumed: true}
