# Points of the pump station. The differential pressure setpoint is tier T3
# and the lead pump tier T2 (SDD 8.2).
- {name: p1_running, kind: binary_in, default: true, tier: T0, description: "Pump 1 running", assumed: true}
- {name: p2_running, kind: binary_in, default: true, tier: T0, description: "Pump 2 running", assumed: true}
- {name: p3_running, kind: binary_in, default: false, tier: T0, description: "Pump 3 running", assumed: true}
- {name: speed_pct, kind: analog_in, default: 0.0, tier: T0, description: "Speed of the running pumps", unit: "%", range: [0, 100], assumed: true}
- {name: power_kw, kind: analog_in, default: 0.0, tier: T0, description: "Electrical power of the running pumps", unit: kW, range: [0, 10000], assumed: true}
- {name: flow_kg_s, kind: analog_in, default: 0.0, tier: T0, description: "Flow delivered to the loop", unit: kg/s, range: [0, 100000], assumed: true}
- {name: supply_c, kind: analog_in, default: 18.0, tier: T0, description: "Chilled water temperature delivered", unit: degC, range: [-10, 150], assumed: true}
- {name: dp_sp_kpa, kind: analog_setting, default: 150.0, tier: T3, description: "Loop differential pressure setpoint", unit: kPa, range: [60, 200], assumed: true}
- {name: lead_pump, kind: enum_status, values: ["1", "2", "3"], default: "1", tier: T2, description: Lead pump of the duty rotation, assumed: true}
