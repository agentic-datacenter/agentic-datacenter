# Points of the fuel oil system. A name that contains `sub_` is declared once here
# and exists once per generator: `sub_level_pct` becomes `sub_a_level_pct` and
# `alarm_sub_low_level` becomes `alarm_sub_a_low_level` for train A, and so on.
- {name: bulk_level_pct, kind: analog_in, default: 100.0, tier: T0, description: "Bulk storage level, both tanks together", unit: "%", range: [0, 100], assumed: true}
- {name: bulk_litre, kind: analog_in, default: 50000.0, tier: T0, description: "Fuel in bulk storage", unit: l, range: [0, 10000000], assumed: true}
- {name: polishing, kind: binary_in, default: false, tier: T0, description: "The polishing skid is circulating bulk fuel", assumed: true}
- {name: polish_enable, kind: binary_cmd, default: true, tier: T2, description: "Scheduled polishing enabled", assumed: true}
- {name: transfer_enable, kind: binary_cmd, default: true, tier: T2, description: "Transfer pumps enabled", assumed: true}
- {name: alarm_leak, kind: binary_in, default: false, tier: T0, description: "Interstitial leak detected; transfer and polishing stopped", assumed: true}
- {name: leak_location, kind: enum_status, values: [NONE, BULK, SUB_BASE], default: NONE, tier: T0, description: "Where the interstitial sensor is wet", assumed: true}
- {name: power_kw, kind: analog_in, default: 0.0, tier: T0, description: "Power drawn by pumps and the polishing skid", unit: kW, range: [0, 1000], assumed: true}
- {name: sub_level_pct, kind: analog_in, default: 90.0, tier: T0, description: "Sub-base tank level", unit: "%", range: [0, 100], assumed: true}
- {name: sub_time_to_empty_h, kind: analog_in, default: 1000.0, tier: T0, description: "Hours until the sub-base tank is empty at the present burn and refill; 1000 when it is not falling", unit: h, range: [0, 1000], assumed: true}
- {name: sub_pump_running, kind: binary_in, default: false, tier: T0, description: "Transfer pump of this sub-base tank running", assumed: true}
- {name: alarm_sub_pump_fault, kind: binary_in, default: false, tier: T0, description: "Transfer pump called and not running", assumed: true}
- {name: alarm_sub_low_level, kind: binary_in, default: false, tier: T0, description: "Sub-base tank below its low-level alarm", assumed: true}
- {name: alarm_sub_overfill, kind: binary_in, default: false, tier: T0, description: "Sub-base tank at its high-high switch; pump tripped", assumed: true}
