# Points of one UPS. Nothing is writable from the network (SDD 8.2).
- {name: mode, kind: enum_status, values: [ONLINE, ON_BATTERY, BYPASS, DEPLETED], default: ONLINE, tier: T0, description: Operating mode, assumed: true}
- {name: soc_pct, kind: analog_in, default: 100.0, tier: T0, description: "Battery state of charge", unit: "%", range: [0, 100], assumed: true}
- {name: output_kw, kind: analog_in, default: 0.0, tier: T0, description: "Real power delivered", unit: kW, range: [0, 100000], assumed: true}
- {name: input_kw, kind: analog_in, default: 0.0, tier: T0, description: "Real power drawn", unit: kW, range: [0, 100000], assumed: true}
- {name: loss_kw, kind: analog_in, default: 0.0, tier: T0, description: "Losses released as heat", unit: kW, range: [0, 100000], assumed: true}
- {name: autonomy_s, kind: analog_in, default: 0.0, tier: T0, description: "Remaining battery time at the present load", unit: s, range: [0, 1000000], assumed: true}
- {name: on_battery_alarm, kind: binary_in, default: false, tier: T0, description: "Running on battery", assumed: true}
