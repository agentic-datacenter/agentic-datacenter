[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-datacenter-net"
version = "0.0.0"
description = "Agentic Datacenter L4 Network: Zone and conduit model and the per-device protocol servers."
readme = "README.md"
license = "BUSL-1.1"
requires-python = ">=3.12"
dependencies = [
    "agentic-datacenter-core",
    "agentic-datacenter-supervisory",
    "asyncua>=2.1,<3",
    "pymodbus>=3.16,<4",
    "bacpypes3>=0.0.110,<0.1",
    "pysnmp>=7.1.32,<8",
]

[tool.uv.sources]
agentic-datacenter-core = { workspace = true }
agentic-datacenter-supervisory = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_datacenter"]

[dependency-groups]
test = ["pytest", "hypothesis"]

[tool.agentic-datacenter]
requirements = [
    "ADC-SAF-001",
    "ADC-SAF-002",
    "ADC-NET-001", "ADC-NET-002", "ADC-NET-003", "ADC-NET-004",
    "ADC-PRO-001", "ADC-PRO-002",
]
