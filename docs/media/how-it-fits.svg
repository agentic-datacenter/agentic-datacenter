<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="t d">
  <title id="t">How Agentic-Datacenter fits together</title>
  <desc id="d">An AI agent proposes an action under a contract. The control path puts it to the control under test, which allows it, denies it or asks a person. An allowed action is written through the site network to the simulated plant. The judge replays every decision the other way, measures both on the plant's true state, and writes the result card.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#8BD8E3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x=".5" y=".5" width="879" height="399" rx="10" fill="#162331" stroke="#52647A"/>

  <g fill="#203548" stroke="#38566B">
    <rect x="24.5" y="150.5" width="150" height="76" rx="7"/>
    <rect x="224.5" y="150.5" width="200" height="76" rx="7"/>
    <rect x="474.5" y="150.5" width="180" height="76" rx="7"/>
    <rect x="704.5" y="150.5" width="152" height="76" rx="7"/>
    <rect x="474.5" y="28.5" width="180" height="76" rx="7"/>
    <rect x="224.5" y="290.5" width="430" height="84" rx="7"/>
    <rect x="704.5" y="290.5" width="152" height="84" rx="7"/>
  </g>
  <rect x="224.5" y="28.5" width="200" height="76" rx="7" fill="#1D3F4C" stroke="#8BD8E3" stroke-width="1.5"/>

  <g fill="none" stroke="#8BD8E3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)">
    <path d="M175 188h47"/>
    <path d="M425 188h47"/>
    <path d="M655 188h47"/>
    <path d="M290 150v-43"/>
    <path d="M358 105v43"/>
    <path d="M472 66h-45" marker-start="url(#a)"/>
    <path d="M324 227v61"/>
    <path d="M780 227v31H560v30"/>
    <path d="M655 332h47"/>
  </g>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g fill="#FFF" font-size="14.5" font-weight="650">
      <text x="99.500" y="182">AI agent</text>
      <text x="324.500" y="174">Control path</text>
      <text x="564.500" y="174">Site network</text>
      <text x="780.500" y="182">Simulated plant</text>
      <text x="324.500" y="60">Your control</text>
      <text x="564.500" y="60">A person</text>
      <text x="439.500" y="318">The judge</text>
      <text x="780.500" y="318">Result card</text>
    </g>
    <g fill="#D2DCE7" font-size="12.5">
      <text x="99.500" y="202">scripted, or a model</text>
      <text x="324.500" y="194">one contract for each action:</text>
      <text x="324.500" y="211">bounds, premises, mandate</text>
      <text x="564.500" y="194">Modbus · BACnet · SNMP</text>
      <text x="564.500" y="211">OPC UA · zones</text>
      <text x="780.500" y="202">cooling · power · IT</text>
      <text x="324.500" y="80">the governance system</text>
      <text x="324.500" y="96">under test</text>
      <text x="564.500" y="80">approves or rejects,</text>
      <text x="564.500" y="96">when asked</text>
      <text x="439.500" y="339">Every decision is replayed the other way, and both</text>
      <text x="439.500" y="356">are measured on the plant's true state.</text>
      <text x="780.500" y="339">harm let through,</text>
      <text x="780.500" y="356">sound steps blocked</text>
    </g>
    <g fill="#8BD8E3" font-size="11.5">
      <text x="199" y="179">proposes</text>
      <text x="449" y="179">writes</text>
      <text x="282" y="133" text-anchor="end">the step, and what is known</text>
      <text x="366" y="133" text-anchor="start">allow · deny · ask</text>
      <text x="332" y="264" text-anchor="start">every decision</text>
      <text x="670" y="252">true state</text>
    </g>
  </g>
</svg>
